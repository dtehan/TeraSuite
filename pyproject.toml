[project]
name = "tera-agent-evals"
version = "0.1.0"
description = "Eval harness for the Teradata Tera agent, using the local YAML cases, a Bedrock driver, and deepeval"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=1.4.0",
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "judge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: calls Amazon Bedrock and the Teradata Tera MCP endpoint",
]

[tool.ruff]
line-length = 120
